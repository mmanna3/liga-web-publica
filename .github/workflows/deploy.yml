name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build for GitHub Pages
        run: npm run build:gh-pages
        env:
          API_BASE_URL: https://admin.edefi.com.ar/api/carnet-digital
          API_ORIGIN: https://admin.edefi.com.ar
          PUBLIC_API_BASE_URL: https://admin.edefi.com.ar/api/carnet-digital
          PUBLIC_API_ORIGIN: https://admin.edefi.com.ar
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/liga-web-publica
          PUBLIC_LIGA_NOMBRE: EDEFI

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Build for FTP (production)
        run: npm run build:local
        env:
          API_BASE_URL: https://admin.edefi.com.ar/api/carnet-digital
          API_ORIGIN: https://admin.edefi.com.ar
          PUBLIC_API_BASE_URL: https://admin.edefi.com.ar/api/carnet-digital
          PUBLIC_API_ORIGIN: https://admin.edefi.com.ar
          PUBLIC_SITE_URL: https://edefi.com.ar
          PUBLIC_LIGA_NOMBRE: EDEFI

      - name: Sincronizar archivos (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
